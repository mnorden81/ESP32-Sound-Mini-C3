; Soundmodul Mini (C3) - PlatformIO-Projekt
;
; Aufruf (im Ordner firmware/):
;   pio run              Firmware bauen
;   pio run -t upload    bauen und flashen
;   pio run -t uploadfs  Sounds aus data/ ins Flash (LittleFS)

[platformio]
default_envs = c3

[env:c3]
; Arduino-ESP32 Core 3.0.7 (ESP-IDF 5.1) ueber pioarduino, gleicher Core wie
; alle anderen ESP32-Firmwaren. Die Firmware selbst kommt spaeter und
; bekommt dann wie das Mini S3 eine Kopie von RC_Common (src/RC_Common/).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; 4 MB Flash: 2 x 1,25 MB App (OTA) + ca. 1,3 MB Dateisystem fuer Sounds
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.filesystem = littlefs
; Core 3.x baut mit gnu++2b, C++17 laeuft damit ohne eigenes -std
build_flags =
    -Wall
    -Wextra
    ; Konsole ueber den nativen USB-Anschluss, UARTs bleiben frei
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

